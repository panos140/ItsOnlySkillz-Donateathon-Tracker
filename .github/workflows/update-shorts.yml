name: Update Shorts

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Install yt-dlp
      run: |
        pip install yt-dlp


    - name: Get Shorts
      run: |
        python shorts.py


    - name: Save changes
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add shorts.json
        git commit -m "Update Shorts" || exit 0
        git push
