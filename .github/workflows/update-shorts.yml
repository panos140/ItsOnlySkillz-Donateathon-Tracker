name: Update Shorts

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Install yt-dlp
      run: |
        pip install yt-dlp


    - name: Update Shorts list
      run: |
        python shorts.py


    - name: Commit updated shorts.json
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add shorts.json

        git commit -m "Update Shorts" || exit 0

        git push
